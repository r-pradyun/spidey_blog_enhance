<!doctype html>
<html>
<head><meta charset="utf-8"><title>Bridge demo</title></head>
<body>
  <h3>AndroidBridge openExternalLink() demo</h3>

  <button onclick="AndroidBridge.openExternalLink('https://example.com')">
    Open safe https://example.com
  </button>

  <button onclick="AndroidBridge.openExternalLink('tel:1234567890')">
    Attempt tel: scheme (should open dialer if allowed)
  </button>

  <button onclick="AndroidBridge.openExternalLink('market://details?id=com.android.chrome')">
    Attempt market:// scheme (Play Store if installed)
  </button>

  <pre id="log"></pre>

  <script>
    // Just for visibility in case AndroidBridge isn't present
    const log = (m) => document.getElementById('log').textContent += m + "\n";
    if (typeof AndroidBridge === "undefined") {
      log("AndroidBridge not found (not running inside the app WebView).");
    } else {
      log("AndroidBridge found.");
      log("This demonstrates: any scheme string is forwarded to ACTION_VIEW with no validation.");
    }
  </script>
</body>
</html>
